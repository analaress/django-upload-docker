<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de upload de arquivo</title><desc id="desc">Navegador envia multipart para Nginx, Django valida e grava no volume media_data e metadados no PostgreSQL.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#475569"/></marker><style>.b{fill:#fff;stroke:#475569;stroke-width:2;rx:12}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{font:13px Arial;fill:#475569}.p{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1100" height="300" fill="#fff"/><text x="550" y="35" text-anchor="middle" class="t">Fluxo do upload — Navegador → Nginx → Django → volumes</text>
  <rect x="35" y="100" width="170" height="90" class="b"/><text x="120" y="137" text-anchor="middle" class="t">Navegador</text><text x="120" y="164" text-anchor="middle" class="s">multipart/form-data</text>
  <rect x="270" y="100" width="170" height="90" class="b"/><text x="355" y="137" text-anchor="middle" class="t">Nginx</text><text x="355" y="164" text-anchor="middle" class="s">proxy → web:8000</text>
  <rect x="505" y="100" width="190" height="90" class="b"/><text x="600" y="137" text-anchor="middle" class="t">Django</text><text x="600" y="164" text-anchor="middle" class="s">valida e salva</text>
  <rect x="760" y="65" width="150" height="75" class="b"/><text x="835" y="97" text-anchor="middle" class="t">media_data</text><text x="835" y="120" text-anchor="middle" class="l">arquivo físico</text>
  <rect x="760" y="165" width="150" height="75" class="b"/><text x="835" y="197" text-anchor="middle" class="t">PostgreSQL</text><text x="835" y="220" text-anchor="middle" class="l">metadados</text>
  <path d="M205 145H270" class="p"/><path d="M440 145H505" class="p"/><path d="M695 125H760" class="p"/><text x="728" y="112" text-anchor="middle" class="l">grava</text><path d="M695 165H760" class="p"/><text x="728" y="155" text-anchor="middle" class="l">registra</text>
  <text x="550" y="275" text-anchor="middle" class="l">Depois, o Nginx lê media_data em /var/www/media e entrega o arquivo em /media/.</text>
</svg>
