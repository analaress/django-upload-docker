<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Comunicação entre os containers</title><desc id="desc">Nginx encaminha para web e web acessa db usando DNS interno e portas internas.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#475569"/></marker><style>.b{fill:#fff;stroke:#475569;stroke-width:2;rx:12}.g{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 6;rx:16}.t{font:700 20px Arial;fill:#0f172a}.s{font:15px Arial;fill:#334155}.l{font:13px Arial;fill:#475569}.p{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1100" height="360" fill="#fff"/><text x="550" y="35" text-anchor="middle" class="t">Comunicação — rede Docker rede_aplicacao</text>
  <rect x="30" y="65" width="1040" height="250" class="g"/><text x="55" y="95" class="t">DNS interno por nome de serviço</text>
  <rect x="70" y="145" width="190" height="90" class="b"/><text x="165" y="180" text-anchor="middle" class="t">Cliente</text><text x="165" y="207" text-anchor="middle" class="s">localhost:8090</text>
  <rect x="360" y="130" width="190" height="120" class="b"/><text x="455" y="170" text-anchor="middle" class="t">nginx</text><text x="455" y="198" text-anchor="middle" class="s">porta interna 80</text><text x="455" y="222" text-anchor="middle" class="l">proxy_pass</text>
  <rect x="650" y="130" width="190" height="120" class="b"/><text x="745" y="170" text-anchor="middle" class="t">web</text><text x="745" y="198" text-anchor="middle" class="s">Gunicorn:8000</text><text x="745" y="222" text-anchor="middle" class="l">hostname: web</text>
  <rect x="900" y="145" width="140" height="90" class="b"/><text x="970" y="180" text-anchor="middle" class="t">db</text><text x="970" y="207" text-anchor="middle" class="s">5432</text>
  <path d="M260 190H360" class="p"/><text x="310" y="175" text-anchor="middle" class="l">8090 → 80</text><path d="M550 190H650" class="p"/><text x="600" y="175" text-anchor="middle" class="l">web:8000</text><path d="M840 190H900" class="p"/><text x="870" y="175" text-anchor="middle" class="l">db:5432</text>
</svg>
