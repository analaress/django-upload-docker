<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">Persistência de dados</title><desc id="desc">PostgreSQL, uploads e arquivos estáticos são mantidos em volumes Docker.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#475569"/></marker><style>.b{fill:#fff;stroke:#475569;stroke-width:2;rx:12}.t{font:700 19px Arial;fill:#0f172a}.s{font:15px Arial;fill:#334155}.l{font:13px Arial;fill:#475569}.p{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1100" height="390" fill="#fff"/><text x="550" y="35" text-anchor="middle" class="t">Persistência de dados em volumes Docker</text>
  <rect x="55" y="115" width="220" height="105" class="b"/><text x="165" y="155" text-anchor="middle" class="t">db</text><text x="165" y="183" text-anchor="middle" class="s">PostgreSQL</text><text x="165" y="205" text-anchor="middle" class="l">/var/lib/postgresql/data</text>
  <rect x="440" y="115" width="220" height="105" class="b"/><text x="550" y="155" text-anchor="middle" class="t">web</text><text x="550" y="183" text-anchor="middle" class="s">Django / Gunicorn</text><text x="550" y="205" text-anchor="middle" class="l">/app/media e /app/staticfiles</text>
  <rect x="825" y="85" width="220" height="85" class="b"/><text x="935" y="120" text-anchor="middle" class="s">postgres_data</text><text x="935" y="145" text-anchor="middle" class="l">banco persistente</text>
  <rect x="825" y="195" width="220" height="85" class="b"/><text x="935" y="230" text-anchor="middle" class="t">media_data</text><text x="935" y="255" text-anchor="middle" class="l">uploads persistentes</text>
  <rect x="825" y="305" width="220" height="70" class="b"/><text x="935" y="335" text-anchor="middle" class="t">static_data</text><text x="935" y="359" text-anchor="middle" class="l">arquivos coletados</text>
  <path d="M275 165H825" class="p"/><text x="550" y="150" text-anchor="middle" class="l">monta postgres_data</text><path d="M660 180 C740 180 760 235 825 235" class="p"/><text x="745" y="195" class="l">grava</text><path d="M660 165 C740 165 770 340 825 340" class="p"/><text x="740" y="315" class="l">collectstatic</text>
  <text x="550" y="388" text-anchor="middle" class="l">docker compose down preserva volumes; docker compose down -v remove os dados.</text>
</svg>
