server {
    listen 80;
    server_name _;

    # Até 5 imagens de 10 MB por envio (com folga para o multipart).
    client_max_body_size 55m;

    location /static/ {
        alias /var/www/static/;
        expires 7d;
    }

    # O conteúdo das imagens não é mais servido do volume local: os downloads
    # passam por views autenticadas do Django, que leem do S3/LocalStack.
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
