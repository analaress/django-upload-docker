{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Central de Arquivos</title>
    <link rel="stylesheet" href="{% static 'envios/estilos.css' %}">
</head>
<body>
    <main class="pagina">
        <header class="cabecalho">
            <h1>Upload de Arquivos</h1>
        </header>

        {% if messages %}{% for message in messages %}<div class="mensagem mensagem-{{ message.tags }}">{{ message }}</div>{% endfor %}{% endif %}

        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
