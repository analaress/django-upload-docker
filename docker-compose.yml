services:
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:15432:5432"
    cpus: "0.50"
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aplicacao}
      POSTGRES_USER: ${POSTGRES_USER:-aplicacao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [rede_aplicacao]

  localstack:
    image: localstack/localstack:3.8
    ports:
      - "127.0.0.1:${PORTA_LOCALSTACK:-4566}:4566"
    environment:
      SERVICES: s3,dynamodb,lambda
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      PERSISTENCE: "1"
      LAMBDA_DOCKER_NETWORK: rede_aplicacao
      LAMBDA_REMOVE_CONTAINERS: "1"
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [rede_aplicacao]

  provisionador:
    build:
      context: .
      dockerfile: infra/localstack/Dockerfile
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      S3_BUCKET_ORIGINAIS: ${S3_BUCKET_ORIGINAIS:-central-arquivos-originais}
      S3_BUCKET_PROCESSADOS: ${S3_BUCKET_PROCESSADOS:-central-arquivos-processados}
      DYNAMODB_TABLE_USUARIOS: ${DYNAMODB_TABLE_USUARIOS:-usuarios}
      DYNAMODB_INDICE_EMAIL: ${DYNAMODB_INDICE_EMAIL:-email-index}
      LAMBDA_FUNCAO: ${LAMBDA_FUNCAO:-processar-imagem}
      LARGURA_MAXIMA_MINIATURA: ${LARGURA_MAXIMA_MINIATURA:-300}
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"
    networks: [rede_aplicacao]

  web:
    build: .
    cpus: "0.75"
    mem_limit: 512m
    environment:
      DEBUG: ${DEBUG:-0}
      SECRET_KEY: ${SECRET_KEY:-chave-insegura-apenas-para-desenvolvimento}
      HOSTS_PERMITIDOS: ${HOSTS_PERMITIDOS:-localhost,127.0.0.1}
      ORIGENS_CSRF_PERMITIDAS: ${ORIGENS_CSRF_PERMITIDAS:-http://localhost:8090,http://127.0.0.1:8090}
      POSTGRES_DB: ${POSTGRES_DB:-aplicacao}
      POSTGRES_USER: ${POSTGRES_USER:-aplicacao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      S3_BUCKET_ORIGINAIS: ${S3_BUCKET_ORIGINAIS:-central-arquivos-originais}
      S3_BUCKET_PROCESSADOS: ${S3_BUCKET_PROCESSADOS:-central-arquivos-processados}
      DYNAMODB_TABLE_USUARIOS: ${DYNAMODB_TABLE_USUARIOS:-usuarios}
      DYNAMODB_INDICE_EMAIL: ${DYNAMODB_INDICE_EMAIL:-email-index}
      LIMITE_TAMANHO_IMAGEM_MB: ${LIMITE_TAMANHO_IMAGEM_MB:-10}
      LIMITE_ARQUIVOS_POR_ENVIO: ${LIMITE_ARQUIVOS_POR_ENVIO:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes: [static_data:/app/staticfiles]
    depends_on:
      db:
        condition: service_healthy
      provisionador:
        condition: service_completed_successfully
    networks: [rede_aplicacao]

  nginx:
    image: nginx:1.27-alpine
    cpus: "0.25"
    mem_limit: 128m
    ports: ["${PORTA_NGINX:-8090}:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
    depends_on: [web]
    networks: [rede_aplicacao]

volumes:
  postgres_data:
  static_data:
  localstack_data:

networks:
  rede_aplicacao:
    name: rede_aplicacao
